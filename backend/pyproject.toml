[project]
name = "atcoder-review-backend"
version = "0.1.0"
description = "AtCoder review tool - Lambda backend"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "moto[dynamodb]>=5.0.0",
    "requests-mock>=1.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
